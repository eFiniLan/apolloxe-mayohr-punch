name = "apollo-auto-punch"
main = "src/index.ts"
compatibility_date = "2024-12-30"

# Stateless — no KV. Idempotency comes from the server (already_done / cooldown).

# Optional: cache the login cookie + calendar across fires (≈1 login / 9 days
# instead of ~48/day). Without this the Worker is stateless (server idempotency).
#   npx wrangler kv namespace create APOLLO_KV
# then uncomment and paste the printed id:
# [[kv_namespaces]]
# binding = "APOLLO_KV"
# id = "<id>"

# Cron is UTC; Taiwan = UTC+8. Fires EVERY day (not just Mon–Fri) so makeup
# workdays (補班) on weekends still run — the calendar's isWorkday decides whether
# to actually punch, so weekends/holidays self-skip after one cheap check. Each
# fire attempts a punch only once it's past the randomized target time.
#   00:00–01:55 UTC = 08:00–09:55 Taipei  → clock-in
#   10:00–11:55 UTC = 18:00–19:55 Taipei  → clock-out
# (Aligns with default shift 09:30/18:30 + early-in/late-out jitter. If your shift
#  is much earlier/later, widen these UTC windows to cover it.)
[triggers]
crons = ["*/5 0-1 * * *", "*/5 10-11 * * *"]

# Non-sensitive defaults. Code has sane defaults for everything else; override
# here as needed. Secrets (MAYO_USERNAME, MAYO_PASSWORD) go via
# `wrangler secret put`, never here.
[vars]
TIMEZONE = "Asia/Taipei"
DRY_RUN = "true"
# GPS punch location — office coordinates + the location id it belongs to.
# Run `npm run config set location` (no id) to see your location ids.
PUNCH_LATITUDE = "25.0781415"
PUNCH_LONGITUDE = "121.5703676"
PUNCHES_LOCATION_ID = "0e7d3f49-1fe5-49ef-aeb7-e54d4c434ab1" # 台北辦公室 (Taipei, L001)
# GPS_JITTER_METERS = "12"        # random shift radius per punch
# Timing (all optional; sensible defaults in code):
# PUNCH_EARLY_IN_MIN = "1"        # clock in 1–15 min before scheduled start
# PUNCH_EARLY_IN_MAX = "15"
# PUNCH_LATE_OUT_MIN = "1"        # clock out 1–15 min after scheduled end
# PUNCH_LATE_OUT_MAX = "15"
# REACTION_BUFFER_MIN = "10"      # clock in at least this many min early (so a failed run is visible with time to punch manually)
# RESPECT_LEAVE = "false"         # true = skip full-day-leave days
